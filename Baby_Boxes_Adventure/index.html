

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eaf0fb">
  <title>Baby Boxes samuel hollows</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.js"></script>
  <script defer src="Baby_Boxes_Adventure.js"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #17243b;
      background: #eaf0fb;
    }

    * { box-sizing: border-box; }

    html, body, #renderCanvas {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body { position: relative; }

    #renderCanvas {
      display: block;
      touch-action: none;
      outline: none;
    }

    .title-card, .help-card {
      position: absolute;
      z-index: 1;
      top: 22px;
      border: 1px solid rgb(255 255 255 / 75%);
      border-radius: 16px;
      background: rgb(255 255 255 / 83%);
      box-shadow: 0 12px 36px rgb(34 55 91 / 12%);
      backdrop-filter: blur(12px);
    }

    .title-card {
      left: 22px;
      padding: 14px 18px;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: #60718b;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 3vw, 28px);
      line-height: 1.1;
    }

    .help-card {
      right: 22px;
      max-width: min(320px, calc(100vw - 44px));
      padding: 12px 15px;
      color: #42526b;
      font-size: 13px;
      line-height: 1.45;
    }

    #model-status { margin-top: 5px; font-size: 12px; }
    #model-status[data-state="error"] { color: #a52e38; }
    #model-status[data-state="ready"] { color: #277148; }

    .controls {
      position: absolute;
      z-index: 1;
      bottom: 20px;
      left: 50%;
      padding: 9px 14px;
      border: 1px solid rgb(255 255 255 / 75%);
      border-radius: 999px;
      background: rgb(255 255 255 / 82%);
      box-shadow: 0 8px 26px rgb(34 55 91 / 10%);
      color: #52627a;
      font-size: 12px;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .title-card { top: 12px; left: 12px; padding: 11px 13px; }
      .help-card { top: 12px; right: 12px; max-width: 47vw; padding: 10px 11px; }
      .controls { bottom: 12px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas" aria-label="Interactive 3D scene of stacked boxes and objects"></canvas>
  <header class="title-card">
    <p class="eyebrow">A little 3D playground</p>
    <h1>Baby Boxes Adventure</h1>
  </header>
  <aside class="help-card">
    <strong>Explore the scene</strong>
    <div>Orbit, zoom, and look around the stacked boxes, shapes, and imported models.</div>
    <div id="model-status" role="status" aria-live="polite" data-state="loading">Loading 3D models…</div>
  </aside>
  <div class="controls">Drag to orbit · Scroll to zoom · Two-finger drag to pan</div>
</body>
</html>
